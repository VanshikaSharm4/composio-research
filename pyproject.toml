[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "composio-research"
version = "0.1.0"
description = "Automated research pipeline analyzing 100 apps across 10 categories for Composio's AI tooling platform"
requires-python = ">=3.11"
dependencies = [
    "composio-core>=0.5.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.90.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hypothesis]
settings = { max_examples = 100 }
